[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voiceledger"
version = "0.1.0"
description = "Local speaker-aware transcription with human-verified identities"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "GPL-3.0-only"
dependencies = [
  "av>=16,<18", "numpy>=2.1,<3", "psutil>=6,<8",
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-multipart>=0.0.20",
  "sqlalchemy>=2.0,<3", "alembic>=1.15,<2", "pydantic>=2.10,<3",
  "typer>=0.16,<1", "huggingface-hub>=0.34,<1", "filelock>=3.16,<4",
  "faster-whisper==1.2.1", "pyannote.audio==4.0.7",
  "torch==2.8.0", "torchaudio==2.8.0", "torchcodec==0.7.0",
]

[dependency-groups]
dev = ["pytest>=8,<9", "httpx>=0.28,<1", "ruff>=0.12,<1"]

[project.scripts]
voiceledger = "voiceledger.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/voiceledger"]

[tool.hatch.build.targets.wheel.force-include]
"frontend/dist" = "voiceledger/web"
"demo" = "voiceledger/demo"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
